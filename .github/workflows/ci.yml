# CI for kept.
#
# Three jobs, split by what they need. The fast one is pure logic, strict
# types and a build — no browser, so it fails in seconds rather than minutes
# when it fails at all. The second serves the built app and runs eight sweeps
# against a real Chromium, in three shards side by side, with one `browser`
# result over them. The third compiles the iPhone app on a Mac. Each of those sweeps found genuine defects the day it was
# written, which is why they are gates and not a ritual someone remembers to
# perform.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# One run per pull request at a time, and the newest is the one that matters.
#
# The browser shards build, install Chromium and run eight sweeps, three of
# which stand up servers of their own; together they are over twenty minutes
# of runner time, and this repository is public so the runners are the free
# ones. Without this, a branch
# that takes four pushes in an hour runs all four in full, three of them
# answering a question about a commit nobody will merge. They do not currently
# delay the fourth — runs here start within seconds of the push — so this is
# about the twenty minutes each, not about waiting.
#
# Only for pull requests. A push to `main` is the record of what that branch
# does, and a later push must not delete it: two commits landing close together
# would leave the first with no result at all, which is exactly the state this
# repository refuses everywhere else — a green tree that was never asked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    # It takes half a minute. Ten is not a budget, it is a backstop.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # Under a non-UK, DST-observing zone on purpose: in UTC or London a
        # date parsed as UTC midnight still lands on the right calendar day,
        # so the timezone bugs these tests exist to catch would pass unnoticed.
        run: npm test
      - name: Build
        run: npx vite build
      - name: What each page downloads before it paints, within its ceiling
        run: npm run budget

  # The sweeps, in three shards that run side by side.
  #
  # One job ran them all until it stopped fitting. Measured on main's own
  # runs: 9.8 minutes on 28 September, 16.4 on 3 October, 22.7 on 5 October,
  # against the 25-minute backstop below. Every sweep added was worth its
  # minutes, and the arithmetic still said that within a pull request or two
  # every run would stop at the backstop and read as a hang. Raising the
  # backstop would have made it a budget, which it was written not to be.
  #
  # Each shard builds and serves the app itself, about a minute of the same
  # setup, so a step's `if` decides only WHICH runner asks it. That `if` is the
  # new way to lose a gate: a shard name spelt wrong runs the step nowhere and
  # reports success. `test/ci-shards.test.ts` holds every sweep to exactly one
  # shard that exists, and every shard to at least one sweep.
  #
  # Balanced by those step timings (`smoke` 404s, `layout` 436s, `a11y` 150s,
  # `ios` 133s, `contrast` 100s, the rest under 35s each), so the slowest shard
  # is about nine minutes where the whole job was twenty-three.
  browser:
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One shard failing says nothing about the others; let each finish so a
      # run reports every sweep it can, not the first one to go red.
      fail-fast: false
      matrix:
        shard: [journeys, screens, access]
    # About nine minutes of work in the slowest shard, so this is a backstop
    # for a step that stops answering rather than a budget anything runs near.
    #
    # The reason to have it at all is what the DEFAULT is. With no
    # `timeout-minutes` a step that stops answering holds this runner until
    # GitHub's six-hour limit and reports nothing at all, so a pull request that
    # is broken reads as one still deciding — and silence is the failure mode
    # this repository is least equipped to notice, since every gate here is
    # written to say what it found. `feed:wiring` carries a deadline per case as
    # well, because it names WHICH case stopped; this is the backstop for the
    # next thing that stops somewhere no script is watching.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npx vite build
      - name: Serve the built app
        run: |
          npx vite preview --port 5183 --strictPort &
          npx wait-on http://localhost:5183/app/ --timeout 60000
      - name: End to end
        if: matrix.shard == 'journeys'
        run: npm run smoke
      - name: WCAG AA contrast over every rendered text node
        if: matrix.shard == 'screens'
        run: npm run contrast
      - name: axe-core audit of every screen
        if: matrix.shard == 'access'
        run: npm run a11y
      - name: Narrow screens, adversarial content, empty states
        if: matrix.shard == 'screens'
        run: npm run layout
      - name: The same fact, stated in more than one place, agrees
        if: matrix.shard == 'journeys'
        run: npm run agreement
      # Last, and on its own port: it starts and then STOPS its own server,
      # because that is the only way to cut a service worker's network — the
      # page-level offline switch the other sweeps have leaves the worker's own
      # fetches reaching the live server. Nothing above it is disturbed.
      - name: A deploy reaches the app, and the app works without one
        if: matrix.shard == 'journeys'
        run: npm run freshness
      # The bundle that actually ships to a phone. Every check above runs
      # against the WEB build; this one builds dist-ios and boots it, which is
      # a different document at a different path. It owns its own port.
      - name: The iOS bundle boots as the app at its root
        if: matrix.shard == 'access'
        run: npm run build:ios && npm run ios
      # Builds the app twice itself, with and without a feed key, and owns its
      # own ports. It is here rather than in the unit job because the question
      # is whether the running app drops an unproven feed, and only a browser
      # can be asked that — the verifier's own tests pass whether or not
      # anything calls it.
      - name: An unproven policy feed does not reach the store
        if: matrix.shard == 'journeys'
        run: npm run feed:wiring

  # The one result to read. A matrix reports a check per shard, named after
  # the shard, so anything that asks for `browser` by name — a required check,
  # or a person looking for the browser sweeps — would otherwise find nothing,
  # and nothing found is not the same as passed. This passes only when every
  # shard did; a shard that was cancelled or never got a runner fails it.
  browser-result:
    name: browser
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every browser shard passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "the browser shards: $RESULT"
          test "$RESULT" = success

  # The iPhone app, compiled. Nothing else here ever builds the native half:
  # the browser job runs the web bundle with the bridge stubbed, so a Swift
  # error, a pod that does not resolve or a plugin missing from the Podfile
  # looks exactly like a browser — and the iOS app was being written with no
  # Mac in reach. This answers the one question a Linux box cannot: does the
  # app as committed compile for iOS. It builds for the simulator without
  # signing, so it needs no Apple account and no secret, and says nothing
  # about running on a device — that still needs one.
  ios:
    name: ios
    runs-on: macos-15
    # A cold CocoaPods install and an Xcode build are about ten minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the iOS web bundle
        run: npm run build:ios
      - name: Sync it into the Xcode project, and install the pods
        run: npx cap sync ios
      - name: The Podfile cap sync wrote is the one committed
        # `ios-plugins.test.ts` reads the committed Podfile; if sync would
        # change it, that test was reading something the build does not use.
        run: git diff --exit-code -- ios/App/Podfile
      - name: Compile for the simulator, unsigned
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
